<div class="row g-0 min-vh-100">
  <section class="col-lg-5 panel-izquierdo d-none d-lg-flex flex-column justify-content-between p-5">
    <div class="text-center">
      <img src="imagenes/dinofit-logo-login.png" alt="DinoFit" class="logo-login">
    </div>
    <div>
      <h1 class="titular fw-bold mb-3">El progreso de tu equipo empieza contigo.</h1>
      <img src="imagenes/login-entrenadores.jpg" alt="Entrenadora con un cliente en el gimnasio"
        class="foto-login w-100 mb-4">
      <div class="d-flex justify-content-between fw-semibold">
        <span><i class="bi bi-people text-warning fs-5 me-2"></i>Acompaña</span>
        <span><i class="bi bi-lightning-charge text-warning fs-5 me-2"></i>Planifica</span>
        <span><i class="bi bi-graph-up text-warning fs-5 me-2"></i>Mide el avance</span>
      </div>
    </div>
    <div></div>
  </section>

  <section class="col-12 col-lg-7 bg-white d-flex flex-column align-items-center justify-content-center p-4">
    <div class="formulario w-100 flex-grow-1 d-flex flex-column justify-content-center">
      <h2 class="display-6 fw-bold mb-1">Bienvenida a DinoFit</h2>
      <p class="text-secondary fs-5 mb-4">Accede a panel de administrador</p>

      <label class="form-label fw-medium text-secondary" for="correo">Correo electrónico</label>
      <div class="input-group input-group-lg mb-4">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
        <input type="email" id="correo" class="form-control border-start-0" value="laura.martinez@dinofit.es">
      </div>

      <label class="form-label fw-medium text-secondary" for="contrasena">Contraseña</label>
      <div class="input-group input-group-lg mb-3">
        <button type="button" class="btn bg-white border border-end-0 text-secondary" (click)="alternarContrasena()"
          aria-label="Mostrar contraseña">
          <i class="bi" [class.bi-eye-slash]="!verContrasena" [class.bi-eye]="verContrasena"></i>
        </button>
        <input [type]="verContrasena ? 'text' : 'password'" id="contrasena" class="form-control border-start-0"
          value="dinofit12345">
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="recordar">
          <label class="form-check-label text-secondary" for="recordar">Recordar mi sesión</label>
        </div>
        <a href="#" class="text-primary fw-semibold text-decoration-none">¿Has olvidado tu contraseña?</a>
      </div>

      <button type="button" class="btn btn-dino btn-lg w-100 mb-4" routerLink="/inicio">Acceder <i
          class="bi bi-arrow-right ms-2"></i></button>
    </div>
    <small class="text-secondary pb-3">Privacidad · Condiciones de uso</small>
  </section>
</div>
