<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block" tabindex="-1" (click)="respuesta.emit(false)">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-body text-center p-4">
        <i class="bi bi-trash3 fs-1 text-danger"></i>
        <h2 class="h5 fw-bold mt-2">¿Eliminar {{ elemento }}?</h2>
        <p class="text-secondary">Esta acción no se puede deshacer.</p>
        <div class="d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-light bg-white border fw-medium" (click)="respuesta.emit(false)">No, cancelar</button>
          <button type="button" class="btn btn-danger fw-medium" (click)="respuesta.emit(true)">Sí, eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
